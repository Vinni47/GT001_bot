<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Компаньон для Gaslands</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="app">
      <h1>Добро пожаловать в Gaslands Companion</h1>
      <p>Приложение для удобного ведения игры.</p>
      
      <!-- Разметка для игрового процесса. Можно добавить кнопки, списки, интерактивные элементы -->
      <div id="content">
        <!-- Здесь будет основной контент (например, настройки игры, статистика и т.д.) -->
      </div>
      
      <!-- Кнопка для отправки данных боту -->
      <button id="sendData">Отправить данные</button>
    </div>
    
    <script src="script.js"></script>
  </body>
</html>
