<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Компаньон для Gaslands</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Экран 1: Мои команды -->
<div id="screen1" class="screen active">
  <header class="top-bar">
    <h1>Мои команды</h1>
    <button class="top-bar-btn" id="btnNewTeamTop">Новая команда</button>
  </header>
  <main class="main-content">
    <p class="no-teams-text">Нет команд.</p>
    <button class="link-button" id="btnNewTeamCenter">Новая команда</button>
  </main>
  <nav class="bottom-nav">
    <button class="nav-btn active" id="navTeams">Мои команды</button>
    <button class="nav-btn" id="navTools">Инструменты</button>
    <button class="nav-btn" id="navMore">Ещё</button>
  </nav>
</div>

<!-- Экран 2: Создание команды -->
<div id="screen2" class="screen">
  <header class="top-bar">
    <button class="top-bar-btn" id="btnCancel">Отмена</button>
    <h1>Create your team!</h1>
    <button class="top-bar-btn" id="btnSave">Save</button>
  </header>
  <main class="main-content">
    <div class="form-group">
      <label for="teamName">Team Name</label>
      <input type="text" id="teamName" placeholder="Enter team name">
    </div>
    <div class="form-group">
      <label for="teamSponsor">Sponsor</label>
      <input type="text" id="teamSponsor" placeholder="Choose sponsor">
    </div>
    <div class="form-group">
      <label for="teamCost">Team Cost</label>
      <input type="number" id="teamCost" value="0" readonly>
    </div>
    <button id="btnAddVehicle">Add Vehicle</button>
  </main>
  <!-- Можно без нижней навигации, если логика другая, но оставим экраны универсальными -->
  <nav class="bottom-nav">
    <button class="nav-btn active" id="navTeams">Мои команды</button>
    <button class="nav-btn" id="navTools">Инструменты</button>
    <button class="nav-btn" id="navMore">Ещё</button>
  </nav>
</div>

<!-- Экран 3: Инструменты (по аналогии со скриншотом Utilities) -->
<div id="screenTools" class="screen">
  <header class="top-bar">
    <h1>Инструменты</h1>
  </header>
  <main class="main-content">
    <h3>UTILITIES</h3>
    <ul class="simple-list">
      <li>Skid Dice Roller</li>
      <li>D6 Quick Reference Guide</li>
      <li>Errata and FAQ (Refuelled)</li>
    </ul>
  </main>
  <nav class="bottom-nav">
    <button class="nav-btn" id="navTeams">Мои команды</button>
    <button class="nav-btn active" id="navTools">Инструменты</button>
    <button class="nav-btn" id="navMore">Ещё</button>
  </nav>
</div>

<!-- Экран 4: Ещё -->
<div id="screenMore" class="screen">
  <header class="top-bar">
    <h1>Ещё</h1>
  </header>
  <main class="main-content">
    <ul class="simple-list">
      <li>App Version <span class="list-value">2.2</span></li>
      <li>Build Number <span class="list-value">20240620</span></li>
      <li>Feedback / Customer Support</li>
      <li>Acknowledgements</li>
      <li>About Privacy</li>
    </ul>
  </main>
  <nav class="bottom-nav">
    <button class="nav-btn" id="navTeams">Мои команды</button>
    <button class="nav-btn" id="navTools">Инструменты</button>
    <button class="nav-btn active" id="navMore">Ещё</button>
  </nav>
</div>

<script src="script.js"></script>
</body>
</html>
